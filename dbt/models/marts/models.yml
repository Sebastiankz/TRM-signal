version: 2

models:
  - name: trm_daily
    description: "Serie completa con métricas derivadas. Grano: una fila por publicación."
    columns:
      - name: valid_from
        data_tests: [unique, not_null]
      - name: value
        data_tests: [not_null]
      - name: pctl_abs
        description: "Percentil empírico de |variación| en las últimas 252 publicaciones."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: trm_by_weekday
    description: "Variación media por día de mercado, con error estándar."
    columns:
      - name: dow_num
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
