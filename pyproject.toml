[project]
name = "trm-signal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sebastiankz", email = "sebastianolivo@uninorte.edu.co" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.68",
    "dbt-postgres>=1.9",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
trm-signal = "trm_signal:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
